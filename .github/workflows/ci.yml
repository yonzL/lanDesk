name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # landesk 唯一必须改动的共享协议库（握手消息要加进它的 protobuf 定义），
  # 所以先把它变成每次提交都可验证的闸门。
  hbb-common:
    name: cargo check / hbb_common
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/hbb_common
      - name: cargo check -p hbb_common --all-targets
        run: cargo check -p hbb_common --all-targets
      - name: cargo test -p hbb_common --lib keyauth
        run: cargo test -p hbb_common --lib keyauth

  # 主 crate（Service 与客户端共用的会话内核）。它要 vcpkg 的原生依赖（opus/libvpx/aom/libyuv）
  # 和 libclang（kcp-sys 用 bindgen），所以单独一个作业，并把 vcpkg 的安装结果缓存起来。
  main-crate:
    name: cargo check / main crate
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      VCPKG_BINARY_SOURCES: clear;files,C:\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: 缓存 vcpkg 已编译的包
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ runner.os }}-opus-libvpx-aom-libyuv-v1
      - name: 准备 vcpkg 与原生依赖
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          # 根目录有 vcpkg.json：清单模式会拒绝逐包参数，而且要靠 overlay 的版本钉（aom/libyuv）。
          # 显式 --x-install-root 是为了让 build.rs 的 <VCPKG_ROOT>/installed/<triplet> 找得到。
          $env:VCPKG_DEFAULT_HOST_TRIPLET = "x64-windows-static"
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static --x-install-root="$env:VCPKG_ROOT/installed"
      - name: 确认 libclang 可用
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:LIBCLANG_PATH\libclang.dll")) {
            winget install --id LLVM.LLVM --accept-source-agreements --accept-package-agreements --disable-interactivity
          }
          if (-not (Test-Path "$env:LIBCLANG_PATH\libclang.dll")) {
            throw "libclang.dll not found at $env:LIBCLANG_PATH"
          }
      - name: cargo check -p rustdesk --lib
        run: cargo check -p rustdesk --lib
      # 鉴权的 fail-open 回归测试（缺 transcript 必须拒），不跑就等于没堵。
      - name: cargo test -p rustdesk --lib key_proof
        run: cargo test -p rustdesk --lib key_proof
      - name: cargo check -p landesk-client
        run: cargo check -p landesk-client

# 说明：Session/文件分发的端到端测试（tests/session_smoke.rs）不在 CI 里跑——
# 它要起一个 Service 进程并依赖可截屏的桌面会话，在无人的 runner 上不稳定。

  # 打 tag 才发版（`v*`）：复用 main-crate 的 vcpkg/libclang 准备，编 release 两个 exe，
  # 用 scripts/dist.sh 打出 zip 并附到对应的 GitHub Release。
  release:
    name: release / windows
    if: startsWith(github.ref, 'refs/tags/')
    needs: [main-crate]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VCPKG_ROOT: C:\vcpkg
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      VCPKG_BINARY_SOURCES: clear;files,C:\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: 缓存 vcpkg 已编译的包
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ runner.os }}-opus-libvpx-aom-libyuv-v1
      - name: 准备 vcpkg 与原生依赖
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          # 根目录有 vcpkg.json：清单模式会拒绝逐包参数，而且要靠 overlay 的版本钉（aom/libyuv）。
          # 显式 --x-install-root 是为了让 build.rs 的 <VCPKG_ROOT>/installed/<triplet> 找得到。
          $env:VCPKG_DEFAULT_HOST_TRIPLET = "x64-windows-static"
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static --x-install-root="$env:VCPKG_ROOT/installed"
      - name: 确认 libclang 可用
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:LIBCLANG_PATH\libclang.dll")) {
            winget install --id LLVM.LLVM --accept-source-agreements --accept-package-agreements --disable-interactivity
          }
          if (-not (Test-Path "$env:LIBCLANG_PATH\libclang.dll")) {
            throw "libclang.dll not found at $env:LIBCLANG_PATH"
          }
      - name: cargo build --release
        run: |
          cargo build --release --bin landesk-server -p rustdesk
          cargo build --release -p landesk-client
      # 出包前先确认两个 exe 真的能跑：一个打印版本，一个生成密钥。
      - name: smoke the built binaries
        shell: bash
        run: |
          set -e
          ./target/release/landesk-server.exe --version
          ./target/release/landesk-server.exe --landesk-genkey "$RUNNER_TEMP/smoke.key"
          test -f "$RUNNER_TEMP/public.key"
      - name: pack
        shell: bash
        run: bash scripts/dist.sh
      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/*.zip \
            --title "lanDesk $tag" \
            --notes "Windows x64. See README for the two-machine setup." \
            --verify-tag
